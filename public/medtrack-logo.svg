<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="medtrackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A62EE"/>
      <stop offset="50%" stop-color="#0A46C6"/>
      <stop offset="100%" stop-color="#022B8B"/>
    </linearGradient>
    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#72B2FF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001859" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded Square Container -->
  <rect width="500" height="500" rx="90" ry="90" fill="url(#medtrackBg)"/>

  <!-- Left Stem of M -->
  <path d="M 140 120 C 170 115, 185 125, 185 150 L 185 360 C 185 365, 180 370, 170 370 L 135 370 C 125 370, 120 365, 120 350 L 120 150 C 120 128, 128 122, 140 120 Z" fill="#FFFFFF"/>

  <!-- Middle V of M -->
  <path d="M 185 150 L 250 250 L 315 150 C 330 125, 360 115, 375 120 C 385 123, 390 130, 390 145 L 360 200 C 330 250, 275 300, 250 300 C 230 300, 205 260, 185 150 Z" fill="#FFFFFF"/>

  <!-- Curved Milestone Roadway -->
  <path d="M 110 420 Q 220 400 310 320 T 365 140 T 375 110" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>

  <!-- Milestone Track Inner Line with Circles -->
  <path d="M 125 415 Q 225 395 305 325 T 360 145" fill="none" stroke="#0B48C8" stroke-width="4"/>

  <!-- Milestone Nodes -->
  <circle cx="195" cy="388" r="10" fill="#FFFFFF" stroke="#0B48C8" stroke-width="5"/>
  <circle cx="260" cy="358" r="10" fill="#FFFFFF" stroke="#0B48C8" stroke-width="5"/>
  <circle cx="315" cy="308" r="10" fill="#FFFFFF" stroke="#0B48C8" stroke-width="5"/>
  <circle cx="348" cy="235" r="10" fill="#FFFFFF" stroke="#0B48C8" stroke-width="5"/>

  <!-- Top Goal Node -->
  <circle cx="380" cy="95" r="16" fill="#FFFFFF" filter="url(#nodeShadow)"/>

  <!-- Medical Student Figure Silhouette in Center -->
  <g transform="translate(230, 260) scale(0.95)" fill="#0B48C8">
    <!-- Head -->
    <circle cx="20" cy="10" r="7"/>
    <!-- Torso / Lab coat -->
    <path d="M 10 22 C 12 18, 28 18, 30 22 L 34 60 C 34 62, 32 65, 29 65 L 11 65 C 8 65, 6 62, 6 60 Z"/>
    <!-- Lab coat front split line -->
    <line x1="20" y1="22" x2="20" y2="65" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Legs -->
    <rect x="11" y="65" width="7" height="28" rx="2"/>
    <rect x="22" y="65" width="7" height="28" rx="2"/>
  </g>
</svg>
